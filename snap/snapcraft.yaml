name: victoriametrics-core24-minimal
base: core24
version: '1.157.0'

summary: VictoriaMetrics Core 24 RISC-V64 with VMUI
description: |
  Unofficial RISC-V64 build of VictoriaMetrics based on Snap Core 24.

  Included:
    - Time-series database
    - Metrics ingestion and storage
    - PromQL / MetricsQL
    - Prometheus HTTP API
    - Prometheus remote_write / remote_read
    - VMUI web interface
    - Embedded web UI assets
    - HTTP server
    - /metrics endpoint

  This is an unofficial community build and is not an official
  VictoriaMetrics release.

license: Apache-2.0
website: https://victoriametrics.com/

platforms:
  riscv64:
    build-on:
      - amd64
    build-for:
      - riscv64

grade: stable
confinement: strict

apps:
  victoriametrics:
    command: bin/victoria-metrics
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind

parts:
  victoriametrics:
    plugin: nil
    source: https://github.com/VictoriaMetrics/VictoriaMetrics.git
    source-tag: v1.157.0

    build-snaps:
      - go/1.27/stable

    override-build: |
      set -eux
      cd "$CRAFT_PART_SRC"

      go version
      go version | grep -q 'go1.27.4'

      export GOOS=linux
      export GOARCH=riscv64
      export CGO_ENABLED=0

      mkdir -p "$CRAFT_PART_INSTALL/bin"

      go build \
        -mod=vendor \
        -trimpath \
        -ldflags "-s -w -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=v1.157.0" \
        -o "$CRAFT_PART_INSTALL/bin/victoria-metrics" \
        ./app/victoria-metrics

    stage:
      - bin/victoria-metrics
